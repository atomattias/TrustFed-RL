[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustfed-agent"
version = "0.1.0"
description = "Closed-loop trust-governed autonomous response for federated honeypot IDS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "sb3-contrib>=2.2.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
trustfed-agent = "trustfed_agent_runner:main"
trustfed-experiment = "run_experiments:main"

[tool.setuptools]
py-modules = ["trustfed_agent_runner", "run_experiments", "experiment"]

[tool.setuptools.packages.find]
where = ["src"]
